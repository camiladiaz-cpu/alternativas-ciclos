<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alternativas de los ciclos | Natura & Avon</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- PapaParse -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- SheetJS (Generador de Excel) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <!-- Fuentes de Marca -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            orange: '#FF6B00',
                            orangeHover: '#E66000',
                            light: '#FFF5F0',
                            gray: '#F4F4F4',
                        },
                        avon: {
                            primary: '#E2197C',
                            light: '#FCE7F3'
                        },
                        text: {
                            main: '#1F2937',
                            sec: '#64748B',
                            mut: '#9CA3AF'
                        },
                        ui: {
                            app: '#F8FAFC',
                            card: '#FFFFFF'
                        }
                    },
                    fontFamily: {
                        sans: ['NaturaAndCo', 'Montserrat', 'Inter', 'sans-serif']
                    },
                    boxShadow: {
                        'soft': '0 2px 4px 0 rgba(0, 0, 0, 0.03), 0 1px 2px -1px rgba(0, 0, 0, 0.02)'
                    }
                }
            }
        }
    </script>

    <style>
        @font-face {
            font-family: 'NaturaAndCo';
            src: local('NaturaAndCo'), local('Montserrat');
            font-display: swap;
        }

        body.modal-open {
            overflow: hidden !important;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
        }
        .no-scrollbar {
            -ms-overflow-style: none !important;
            scrollbar-width: none !important;
        }

        .animate-fade-in {
            animation: fadeIn 0.3s ease-in-out both;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .snap-x { scroll-snap-type: x mandatory; }
        .snap-start { scroll-snap-align: start; }
    </style>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-TTCKV8TKXL"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

</head>

<body class="bg-ui-app text-text-main font-sans antialiased min-h-screen flex flex-col modal-open pb-24">

    <!-- PANTALLA BIENVENIDA MODAL -->
    <div id="cycle-modal" class="fixed inset-0 z-[100] bg-cover bg-center p-2 transition-all duration-500 flex justify-center items-center" style="background-image: url('https://i.ytimg.com/vi/nB0ozLVYQUI/maxresdefault.jpg');">
        <div class="absolute inset-0 bg-stone-900/50 backdrop-blur-sm"></div>
        <div class="relative bg-white/95 backdrop-blur-md p-5 rounded-[1.5rem] shadow-xl border border-white/20 max-w-xs w-full text-center animate-fade-in z-10">
            <h2 class="text-xl font-bold text-text-main mb-0.5 tracking-tight">¡Hola!</h2>
            <p class="text-text-sec text-[11px] mb-4 leading-relaxed">¿En qué ciclo comercial te encontrás?</p>
            <div class="grid grid-cols-2 gap-2">
                <button type="button" onclick="selectInitialCiclo('C16')" class="py-2.5 bg-gray-800 hover:bg-gray-900 text-white font-bold rounded-lg transition-all shadow-sm active:scale-95 cursor-pointer text-[11px] uppercase tracking-wider">
                    Ciclo 16
                </button>
                <button type="button" onclick="selectInitialCiclo('C17')" class="py-2.5 bg-brand-orange hover:bg-brand-orangeHover text-white font-bold rounded-lg transition-all shadow-sm active:scale-95 cursor-pointer text-[11px] uppercase tracking-wider">
                    Ciclo 17
                </button>
            </div>
        </div>
    </div>

    <!-- Header & Filtros -->
    <header id="main-header" class="bg-white border-b border-gray-100 shadow-soft z-50 invisible">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-5 flex flex-col md:flex-row justify-between items-start md:items-center gap-5 relative">
            <div class="flex-1 w-full">
                <div class="flex items-center gap-3">
                    <div id="brand-logo-container" class="transition-all duration-300">
                         <span class="text-2xl font-bold tracking-tight text-brand-orange" id="brand-title">Natura</span>
                    </div>
                    <div class="h-6 w-px bg-gray-200"></div>
                    <h1 class="text-xl font-medium text-text-sec">Alternativas de los ciclos</h1>
                </div>
                <p class="text-text-sec text-[11px] mt-1.5 flex items-center gap-1.5 font-medium tracking-wider uppercase">
                    <i data-lucide="clock" class="w-3.5 h-3.5 stroke-[2.5]"></i> Actualizado: <span id="last-update" class="text-text-mut whitespace-nowrap">Calculando...</span>
                </p>
            </div>
            
            <div class="w-full md:w-auto flex flex-col sm:flex-row gap-4 items-end">
                <div class="w-full sm:w-44">
                    <label for="codigo-search" class="block text-[10px] font-bold uppercase tracking-widest text-text-sec mb-1.5 pl-1">
                        Buscar por Código
                    </label>
                    <div class="relative">
                        <input type="text" id="codigo-search" placeholder="Ej: 207441" class="w-full bg-brand-gray border border-gray-200 rounded-xl px-4 py-3 text-sm font-semibold text-text-main focus:outline-none focus:border-brand-orange focus:ring-1 focus:ring-brand-orange transition-colors shadow-none" />
                    </div>
                </div>

                <div class="w-full sm:w-28">
                    <label for="ciclo-select" class="block text-[10px] font-bold uppercase tracking-widest text-text-sec mb-1.5 pl-1">
                        Ciclo
                    </label>
                    <div class="relative">
                        <select id="ciclo-select" class="w-full appearance-none bg-brand-gray border border-gray-200 rounded-xl px-4 py-3 text-sm font-semibold text-text-main focus:outline-none focus:border-brand-orange focus:ring-1 focus:ring-brand-orange transition-colors cursor-pointer shadow-none">
                            <option value="C16">Ciclo 16</option>
                            <option value="C17">Ciclo 17</option>
                        </select>
                        <i data-lucide="chevron-down" class="absolute right-4 top-1/2 -translate-y-1/2 w-4 h-4 text-text-sec pointer-events-none stroke-[2.5]"></i>
                    </div>
                </div>

                <div class="w-full sm:w-56">
                    <label for="gerencia-select" class="block text-[10px] font-bold uppercase tracking-widest text-text-sec mb-1.5 pl-1">
                        Gerencia de Ventas
                    </label>
                    <div class="relative">
                        <select id="gerencia-select" class="w-full appearance-none bg-brand-gray border border-gray-200 rounded-xl px-4 py-3 text-sm font-semibold text-text-main focus:outline-none focus:border-brand-orange focus:ring-1 focus:ring-brand-orange transition-colors cursor-pointer shadow-none">
                            <option value="">Seleccionar Gerencia...</option>
                        </select>
                        <i data-lucide="chevron-down" class="absolute right-4 top-1/2 -translate-y-1/2 w-4 h-4 text-text-sec pointer-events-none stroke-[2.5]"></i>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- BOTONERA INFERIOR DEL HEADER -->
        <div class="max-w-7xl mx-auto px-4 sm:px-6 flex flex-wrap items-center justify-between gap-4 mt-2">
            <div class="flex gap-8">
                <button type="button" onclick="setTab('Natura')" id="tab-natura" class="py-3 px-1 text-sm font-bold uppercase tracking-widest text-brand-orange border-b-[3px] border-brand-orange transition-all duration-300">Natura</button>
                <button type="button" onclick="setTab('Avon')" id="tab-avon" class="py-3 px-1 text-sm font-bold uppercase tracking-widest text-text-mut border-b-[3px] border-transparent hover:text-avon-primary transition-all duration-300">Avon</button>
            </div>

            <!-- BOTONES SELECCION, EXCEL Y DESCARGA -->
            <div class="flex flex-wrap items-center gap-2 mb-2 sm:mb-0">
                <button type="button" onclick="exportToExcel()" class="py-2 px-4 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-xl transition-all shadow-sm active:scale-95 flex items-center gap-2 cursor-pointer">
                    <i data-lucide="file-spreadsheet" class="w-4 h-4"></i>
                    <span>Descargar en excel</span>
                </button>

                <button type="button" id="btn-selection-mode" onclick="toggleSelectionMode()" class="py-2 px-4 bg-gray-100 hover:bg-gray-200 text-gray-800 text-xs font-bold rounded-xl transition-all border border-gray-200 flex items-center gap-2 cursor-pointer shadow-sm active:scale-95">
                    <i data-lucide="check-square" class="w-4 h-4 text-brand-orange"></i>
                    <span id="selection-btn-text">Selección manual</span>
                </button>

                <button type="button" onclick="downloadAllAlternativesLoose()" class="py-2 px-4 bg-gray-900 hover:bg-black text-white text-xs font-bold rounded-xl transition-all shadow-sm active:scale-95 flex items-center gap-2 cursor-pointer">
                    <i data-lucide="download-cloud" class="w-4 h-4 text-brand-orange"></i>
                    Descargar TODAS (Plan B)
                </button>
            </div>
        </div>
    </header>

    <!-- App Main -->
    <main id="main-content" class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 py-8 invisible">
        
        <div id="loading" class="flex flex-col justify-center items-center py-20">
            <div id="spinner" class="animate-spin rounded-full h-12 w-12 border-[3px] border-brand-gray border-t-brand-orange"></div>
            <p class="mt-5 text-brand-orange font-bold tracking-widest text-[10px] uppercase animate-pulse">Sincronizando Planes...</p>
        </div>

        <div id="empty-state" class="hidden flex-col justify-center items-center py-24 text-center">
            <div class="bg-white p-6 rounded-3xl shadow-soft border border-gray-100 mb-5">
                <i data-lucide="search-x" class="w-12 h-12 text-text-mut stroke-[1.5]"></i>
            </div>
            <h3 class="text-xl font-bold text-text-main mb-2 tracking-tight">Sin resultados</h3>
            <p class="text-text-sec text-sm leading-relaxed max-w-md">No encontramos productos para esta combinación. Intenta cambiando el código o los filtros.</p>
        </div>

        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 hidden"></div>

    </main>

    <!-- BARRA FLOTANTE DE DESCARGA MASIVA SELECCIONADA -->
    <div id="selection-bar" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[80] hidden bg-gray-900/95 backdrop-blur-md text-white px-5 py-3 rounded-full shadow-2xl border border-white/10 flex-col sm:flex-row items-center gap-3 sm:gap-5 transition-all duration-300 w-[90%] sm:w-auto">
        
        <div class="flex items-center gap-4 justify-between w-full sm:w-auto">
            <button type="button" onclick="selectAllInGrid()" class="text-[10px] uppercase font-bold text-brand-orange hover:text-white transition-colors underline whitespace-nowrap cursor-pointer">
                Marcar todas
            </button>
            <span id="selected-count" class="text-xs font-bold tracking-wider uppercase text-gray-300 whitespace-nowrap">0 sel.</span>
        </div>

        <div class="flex items-center gap-2 w-full sm:w-auto justify-center">
            <button type="button" onclick="downloadSelectedBatch()" class="py-2 px-6 bg-brand-orange hover:bg-brand-orangeHover text-white text-xs font-bold rounded-full transition-all shadow-md active:scale-95 cursor-pointer flex items-center gap-1.5 uppercase tracking-wider w-full sm:w-auto justify-center">
                <i data-lucide="download" class="w-3.5 h-3.5"></i> Bajar
            </button>
            <button type="button" onclick="toggleSelectionMode(false)" class="p-2 text-gray-400 hover:text-white transition-colors cursor-pointer bg-white/10 rounded-full" title="Cancelar">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>
    </div>

    <footer id="main-footer" class="bg-white border-t border-gray-100 py-8 text-center px-4 invisible">
        <p class="text-[10px] font-bold uppercase tracking-[0.3em] text-text-mut">
            &copy; <span id="year"></span> Natura &Co <span class="mx-2 opacity-30">|</span> Bien Estar Bien
        </p>
    </footer>

    <script>
        let db = { site: [], gerencias: [], cuotas: {}, stock: {} };
        let state = { tab: 'Natura', gerenciaId: '', ciclo: 'C16', searchCode: '' };
        let currentFilteredItems = [];
        let selectionMode = false;
        let selectedPlansMap = new Map(); 

        function init() {
            if (window.lucide) lucide.createIcons();
            setupCicloSelect();
            setupCodeSearch();
        }

        function setupCicloSelect() {
            const sel = document.getElementById('ciclo-select');
            if (sel) {
                sel.onchange = async e => {
                    state.ciclo = e.target.value;
                    render();
                };
            }
        }

        function setupCodeSearch() {
            const input = document.getElementById('codigo-search');
            if (input) {
                input.oninput = e => {
                    state.searchCode = e.target.value.trim();
                    render();
                };
            }
        }

        async function selectInitialCiclo(cicloId) {
            state.ciclo = cicloId;
            const selectEl = document.getElementById('ciclo-select');
            if (selectEl) selectEl.value = cicloId;
            
            const modal = document.getElementById('cycle-modal');
            if (modal) {
                modal.classList.add('opacity-0', 'pointer-events-none');
                setTimeout(() => { modal.style.display = 'none'; }, 400);
            }
            
            document.body.classList.remove('modal-open');
            
            const header = document.getElementById('main-header');
            const main = document.getElementById('main-content');
            const footer = document.getElementById('main-footer');
            
            if (header) header.classList.remove('invisible');
            if (main) main.classList.remove('invisible');
            if (footer) footer.classList.remove('invisible');

            await loadData();
        }

        async function loadData() {
            try {
                const loadingEl = document.getElementById('loading');
                const gridEl = document.getElementById('product-grid');
                if (loadingEl) loadingEl.classList.remove('hidden');
                if (gridEl) gridEl.classList.add('hidden');
                
                let response = await fetch(`./data.json?v=${new Date().getTime()}`);
                if (!response.ok) {
                    const fallbackName = state.ciclo === 'C16' ? './data.json' : `./data_${state.ciclo}.json`;
                    response = await fetch(`${fallbackName}?v=${new Date().getTime()}`);
                }
                
                if (!response.ok) throw new Error('No se encontraron los datos del ciclo');
                
                const data = await response.json();
                db.site = data.site || [];
                db.gerencias = data.gerencias || [];
                db.cuotas = data.cuotas || {};
                db.stock = data.stock || {};

                updateLastUpdate(data.updatedAt);
                populateGerencias();
                
                if (loadingEl) loadingEl.classList.add('hidden');
                render();

            } catch (err) {
                console.error(err);
                const loadingEl = document.getElementById('loading');
                if (loadingEl) loadingEl.classList.add('hidden');
                Swal.fire({
                    title: 'Aviso de Carga',
                    text: `No se encontraron datos cargados. Por favor ejecutá 'Actualizar_Todo.bat'.`,
                    icon: 'info',
                    confirmButtonColor: '#FF6B00',
                    customClass: { popup: 'rounded-3xl' }
                });
            }
        }

        function populateGerencias() {
            const sel = document.getElementById('gerencia-select');
            if (!sel) return;
            const currentSel = state.gerenciaId;
            sel.innerHTML = '<option value="">Seleccionar Gerencia...</option>';
            
            if (db.gerencias && db.gerencias.length > 0) {
                db.gerencias.sort((a,b) => a.name.localeCompare(b.name)).forEach(g => {
                    const opt = document.createElement('option');
                    opt.value = g.id;
                    opt.textContent = g.name;
                    if(String(g.id).trim() === String(currentSel).trim()) opt.selected = true;
                    sel.appendChild(opt);
                });
            }
            sel.onchange = e => { state.gerenciaId = e.target.value; render(); };
        }

        function setTab(t) {
            state.tab = t;
            const isNatura = t === 'Natura';
            const btnN = document.getElementById('tab-natura');
            const btnA = document.getElementById('tab-avon');
            const title = document.getElementById('brand-title');
            
            if (btnN && btnA && title) {
                if(isNatura) {
                    btnN.className = "py-3 px-1 text-sm font-bold uppercase tracking-widest text-brand-orange border-b-[3px] border-brand-orange transition-all duration-300 cursor-pointer";
                    btnA.className = "py-3 px-1 text-sm font-bold uppercase tracking-widest text-text-mut border-b-[3px] border-transparent hover:text-avon-primary transition-all duration-300 cursor-pointer";
                    title.textContent = "Natura";
                    title.className = "text-2xl font-bold tracking-tight text-brand-orange";
                } else {
                    btnA.className = "py-3 px-1 text-sm font-bold uppercase tracking-widest text-avon-primary border-b-[3px] border-avon-primary transition-all duration-300 cursor-pointer";
                    btnN.className = "py-3 px-1 text-sm font-bold uppercase tracking-widest text-text-mut border-b-[3px] border-transparent hover:text-brand-orange transition-all duration-300 cursor-pointer";
                    title.textContent = "Avon";
                    title.className = "text-2xl font-bold tracking-tight text-avon-primary";
                }
            }
            toggleSelectionMode(false);
            render();
        }

        function getImg(marca, cod) {
            const brand = (marca || '').toString().trim().toLowerCase() === 'avon' ? 'Avon' : 'Natura';
            const cicloNum = (state.ciclo || 'C16').replace(/\D/g, '');
            return `./Imagenes/${brand}/C${cicloNum}/${cod}.jpg`;
        }

        function handleImageError(img, marca, cod) {
            if (!img.dataset.tryStep) img.dataset.tryStep = "1";
            const step = parseInt(img.dataset.tryStep);
            const brand = (marca || '').toString().trim().toLowerCase() === 'avon' ? 'Avon' : 'Natura';
            const cicloNum = (state.ciclo || 'C16').replace(/\D/g, '');
            
            const fallbacks = [
                `./Imagenes/${brand}/C${cicloNum}/${cod}.png`,
                `./Imagenes/${brand}/C${cicloNum}/${cod}.JPG`,
                `./Imagenes/${brand}/C${cicloNum}/${cod}.PNG`,
                `./imagenes/${brand.toLowerCase()}/c${cicloNum}/${cod}.jpg`,
                `./imagenes/${brand.toLowerCase()}/c${cicloNum}/${cod}.png`,
                `./Imagenes/${brand}/${cod}.jpg`,
                `./Imagenes/${brand}/${cod}.png`
            ];
            
            if (step <= fallbacks.length) {
                img.src = fallbacks[step - 1];
                img.dataset.tryStep = (step + 1).toString();
            } else {
                img.src = 'https://placehold.co/400x400/F4F4F4/9CA3AF?text=Próximamente';
                img.onerror = null;
            }
        }

        async function forceDownload(url, fileName) {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Error al descargar');
                const blob = await response.blob();
                const blobUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = fileName || 'placa.jpg';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
            } catch (err) {
                window.open(url, '_blank');
            }
        }

        async function shareDirectToWhatsApp(url, cod, desc) {
            try {
                const response = await fetch(url);
                const blob = await response.blob();
                const file = new File([blob], `${state.tab}_Cod_${cod}.jpg`, { type: 'image/jpeg' });

                if (navigator.canShare && navigator.share({ files: [file] })) {
                    await navigator.share({
                        files: [file],
                        title: `Ampliación ${state.tab}`,
                        text: `✨ *Ampliación ${state.tab}* \n📌 *Código:* ${cod}\n📝 ${desc}`
                    });
                    return;
                }
            } catch (e) {
                console.log("Web Share no soportado");
            }

            const textToShare = encodeURIComponent(`✨ *Ampliación ${state.tab}* \n📌 *Código:* ${cod}\n📝 ${desc}\n\n👉 Mirá la placa acá:\n${url}`);
            window.open(`https://api.whatsapp.com/send?text=${textToShare}`, '_blank');
        }

        function toggleSelectionMode(forceValue) {
            selectionMode = forceValue !== undefined ? forceValue : !selectionMode;
            const btn = document.getElementById('btn-selection-mode');
            const text = document.getElementById('selection-btn-text');
            const bar = document.getElementById('selection-bar');

            if (btn && text && bar) {
                if (selectionMode) {
                    btn.className = "py-2 px-4 bg-brand-orange text-white text-xs font-bold rounded-xl transition-all shadow-md flex items-center gap-2 cursor-pointer active:scale-95";
                    text.textContent = "Cancelar selección";
                    bar.classList.remove('hidden');
                    bar.classList.add('flex');
                } else {
                    btn.className = "py-2 px-4 bg-gray-100 hover:bg-gray-200 text-gray-800 text-xs font-bold rounded-xl transition-all border border-gray-200 flex items-center gap-2 cursor-pointer active:scale-95";
                    text.textContent = "Selección manual";
                    bar.classList.add('hidden');
                    bar.classList.remove('flex');
                    selectedPlansMap.clear();
                    updateSelectionCount();
                }
            }
            render();
        }

        function togglePlanSelection(key, url, fileName, checkbox) {
            if (checkbox.checked) {
                selectedPlansMap.set(key, { url, fileName });
            } else {
                selectedPlansMap.delete(key);
            }
            updateSelectionCount();
        }

        function updateSelectionCount() {
            const count = selectedPlansMap.size;
            const countEl = document.getElementById('selected-count');
            if (countEl) countEl.textContent = `${count} sel.`;
        }

        function selectAllInGrid() {
            currentFilteredItems.forEach(item => {
                item.plans.forEach(plan => {
                    const brandString = item.marca || item.Marca || 'natura';
                    const uniqueKey = `${brandString}_${state.ciclo}_${plan.cod}_${plan.type}`;
                    const imgUrl = getImg(brandString, plan.cod);
                    const fileName = `${brandString}_${state.ciclo}_Cod${plan.cod}_Plan${plan.type}.jpg`;
                    selectedPlansMap.set(uniqueKey, { url: imgUrl, fileName: fileName });
                });
            });
            updateSelectionCount();
            render(); 
        }

        async function downloadSelectedBatch() {
            if (selectedPlansMap.size === 0) {
                Swal.fire({ icon: 'info', title: 'Ninguna seleccionada', text: 'Tildá los casilleros de las placas.', customClass: { popup: 'rounded-3xl p-6' }});
                return;
            }

            const total = selectedPlansMap.size;
            Swal.fire({
                title: 'Descargando...',
                text: `Guardando ${total} imágenes sueltas...`,
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading(),
                customClass: { popup: 'rounded-3xl p-6' }
            });

            for (const [key, item] of selectedPlansMap.entries()) {
                await forceDownload(item.url, item.fileName);
                await new Promise(r => setTimeout(r, 350));
            }

            Swal.fire({ icon: 'success', title: '¡Listo!', text: `Se guardaron ${total} placas.`, timer: 2000, showConfirmButton: false, customClass: { popup: 'rounded-3xl p-6' }});
            toggleSelectionMode(false);
        }

        async function downloadAllAlternativesLoose() {
            const altItems = [];
            currentFilteredItems.forEach(item => {
                item.plans.forEach(plan => {
                    if (plan.type !== 'A') {
                        const brandString = item.marca || item.Marca || 'natura';
                        altItems.push({
                            url: getImg(brandString, plan.cod),
                            fileName: `${brandString}_${state.ciclo}_Cod${plan.cod}_Plan${plan.type}.jpg`
                        });
                    }
                });
            });

            if (altItems.length === 0) {
                Swal.fire({
                    icon: 'info',
                    title: 'Sin alternativas',
                    text: 'No hay Planes B en esta vista para descargar.',
                    confirmButtonColor: '#FF6B00',
                    customClass: { popup: 'rounded-3xl p-6' }
                });
                return;
            }

            Swal.fire({
                title: 'Descargando Planes B...',
                text: `Guardando automáticamente ${altItems.length} imágenes sueltas...`,
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading(),
                customClass: { popup: 'rounded-3xl p-6' }
            });

            for (let i = 0; i < altItems.length; i++) {
                await forceDownload(altItems[i].url, altItems[i].fileName);
                await new Promise(r => setTimeout(r, 350));
            }

            Swal.fire({
                icon: 'success',
                title: '¡Descargas completadas!',
                text: `Se bajaron las ${altItems.length} placas alternativas correctamente.`,
                timer: 2500,
                showConfirmButton: false,
                customClass: { popup: 'rounded-3xl p-6' }
            });
        }

        function exportToExcel() {
            if (!db.site || db.site.length === 0) {
                Swal.fire({
                    title: 'Sin datos',
                    text: 'Aún no se han cargado los datos para exportar.',
                    icon: 'warning',
                    confirmButtonColor: '#FF6B00'
                });
                return;
            }

            const rows = [];
            let allItems = db.site.filter(i => {
                if (i.ciclo) {
                    const itemCicloNum = String(i.ciclo).replace(/\D/g, '');
                    const selectedCicloNum = String(state.ciclo).replace(/\D/g, '');
                    return itemCicloNum.endsWith(selectedCicloNum);
                }
                return true;
            });

            const selectedGerenciaId = state.gerenciaId;
            const gerenciasToProcess = selectedGerenciaId 
                ? db.gerencias.filter(g => String(g.id) === String(selectedGerenciaId))
                : db.gerencias;

            allItems.forEach(item => {
                const planA = item.plans.find(p => p.type === 'A') || {};
                const planB = item.plans.find(p => p.type === 'B') || {};
                const planC = item.plans.find(p => p.type === 'C') || {};
                const planD = item.plans.find(p => p.type === 'D') || {};

                if (gerenciasToProcess.length > 0) {
                    gerenciasToProcess.forEach(g => {
                        const getStock = (cod) => {
                            if (!cod) return '-';
                            const stock = db.cuotas[g.id]?.[cod];
                            return stock !== undefined ? `${stock} un.` : 'Disponible';
                        };

                        rows.push({
                            'Ciclo': state.ciclo,
                            'Marca': item.marca,
                            'Gerencia': g.name,
                            'Cód. Plan A': planA.cod || '',
                            'Descripción Plan A': planA.desc || '',
                            'Cuota Plan A': getStock(planA.cod),
                            'Cód. Plan B': planB.cod || '',
                            'Descripción Plan B': planB.desc || '',
                            'Cuota Plan B': getStock(planB.cod),
                            'Cód. Plan C': planC.cod || '',
                            'Descripción Plan C': planC.desc || '',
                            'Cuota Plan C': getStock(planC.cod),
                            'Cód. Plan D': planD.cod || '',
                            'Descripción Plan D': planD.desc || '',
                            'Cuota Plan D': getStock(planD.cod)
                        });
                    });
                } else {
                    rows.push({
                        'Ciclo': state.ciclo,
                        'Marca': item.marca,
                        'Gerencia': 'Todas',
                        'Cód. Plan A': planA.cod || '',
                        'Descripción Plan A': planA.desc || '',
                        'Cuota Plan A': 'Disponible',
                        'Cód. Plan B': planB.cod || '',
                        'Descripción Plan B': planB.desc || '',
                        'Cuota Plan B': 'Disponible',
                        'Cód. Plan C': planC.cod || '',
                        'Descripción Plan C': planC.desc || '',
                        'Cuota Plan C': 'Disponible',
                        'Cód. Plan D': planD.cod || '',
                        'Descripción Plan D': planD.desc || '',
                        'Cuota Plan D': 'Disponible'
                    });
                }
            });

            const worksheet = XLSX.utils.json_to_sheet(rows);
            worksheet['!cols'] = [
                { wch: 8 }, { wch: 10 }, { wch: 25 }, 
                { wch: 12 }, { wch: 35 }, { wch: 14 },
                { wch: 12 }, { wch: 35 }, { wch: 14 },
                { wch: 12 }, { wch: 35 }, { wch: 14 },
                { wch: 12 }, { wch: 35 }, { wch: 14 }
            ];

            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, `Alternativas_${state.ciclo}`);

            const dateStr = new Date().toISOString().slice(0, 10);
            XLSX.writeFile(workbook, `Alternativas_Natura_y_Avon_${state.ciclo}_${dateStr}.xlsx`);
        }

        async function shareImage(btn, itemIdx) {
            const container = btn.closest('.relative');
            const img = container ? container.querySelector('img') : null;
            
            const url = img ? img.src : window.location.origin + window.location.pathname + getImg(state.tab, btn.getAttribute('data-cod'));
            const cod = btn.getAttribute('data-cod');
            const desc = btn.getAttribute('data-desc');
            const singleFileName = `${state.tab}_${state.ciclo}_Cod${cod}.jpg`;

            Swal.fire({
                title: '¿Qué querés hacer con la placa?',
                html: `
                    <div class="flex flex-col gap-3 mt-4">
                        <button onclick="Swal.close(); shareDirectToWhatsApp('${url}', '${cod}', '${desc}');" class="flex items-center justify-center gap-2 py-3.5 px-4 bg-[#25D366] hover:bg-[#20BA56] text-white font-bold rounded-xl transition-all shadow-md active:scale-95 text-xs uppercase tracking-wider cursor-pointer">
                            💬 Enviar Foto por WhatsApp
                        </button>
                        <button onclick="Swal.close(); forceDownload('${url}', '${singleFileName}');" class="flex items-center justify-center gap-2 py-3.5 px-4 bg-gray-800 hover:bg-gray-900 text-white font-bold rounded-xl transition-all shadow-md active:scale-95 text-xs uppercase tracking-wider cursor-pointer">
                            📥 Descargar Imagen
                        </button>
                    </div>
                `,
                showConfirmButton: false,
                showCloseButton: true,
                customClass: { popup: 'rounded-3xl p-6' }
            });
        }

        function scrollCarousel(btn, dir) {
            const carousel = btn.closest('.snap-x');
            if (carousel) {
                carousel.scrollBy({ left: dir * carousel.clientWidth, behavior: 'smooth' });
            }
        }

        function render() {
            const grid = document.getElementById('product-grid');
            const empty = document.getElementById('empty-state');
            if (!grid || !empty) return;

            grid.innerHTML = '';

            const selectedCicloDigits = String(state.ciclo || '').replace(/\D/g, '');

            currentFilteredItems = db.site.filter(i => {
                if (i.ciclo) {
                    const itemCicloDigits = String(i.ciclo).replace(/\D/g, '');
                    // Busca que termine en el ciclo (lee el "202616")
                    if (!itemCicloDigits.endsWith(selectedCicloDigits)) return false;
                }
                const m = i.marca || i.Marca || i.MARCA || '';
                const matchesBrand = m.trim().toLowerCase() === state.tab.trim().toLowerCase();
                if (!matchesBrand) return false;
                
                if (state.searchCode) {
                    const searchDigits = state.searchCode.replace(/\D/g, '');
                    return i.plans.some(plan => String(plan.cod).replace(/\D/g, '').includes(searchDigits));
                }
                return true;
            });

            if (currentFilteredItems.length === 0) {
                grid.classList.add('hidden');
                empty.classList.remove('hidden');
                empty.classList.add('flex');
            } else {
                grid.classList.remove('hidden');
                empty.classList.add('hidden');
                empty.classList.remove('flex');

                currentFilteredItems.forEach((item, itemIdx) => {
                    const card = document.createElement('div');
                    card.className = "relative animate-fade-in bg-white rounded-2xl border border-gray-100 shadow-soft hover:-translate-y-1 transition-all duration-300 flex flex-col overflow-hidden";
                    card.style.animationDelay = `${itemIdx * 0.05}s`;

                    const carousel = document.createElement('div');
                    carousel.className = "flex overflow-x-auto snap-x scroll-smooth no-scrollbar";
                    
                    const totalPlans = item.plans.length;

                    item.plans.forEach((plan, planIdx) => {
                        const slide = document.createElement('div');
                        slide.className = "min-w-full snap-start p-5 flex flex-col";
                        const isMain = plan.type === 'A';
                        const badgeColor = isMain ? (state.tab.trim().toLowerCase() === 'natura' ? 'bg-brand-orange' : 'bg-avon-primary') : 'bg-gray-800';
                        
                        const searchDigits = String(plan.cod).replace(/\D/g, '');

                        let generalStockVal = undefined;
                        if (db.stock) {
                            const stockKey = Object.keys(db.stock).find(k => String(k).replace(/\D/g, '') === searchDigits);
                            if (stockKey !== undefined) generalStockVal = db.stock[stockKey];
                        }

                        let isGeneralStockOk = true;
                        if (generalStockVal !== undefined && generalStockVal !== null && String(generalStockVal).trim() !== '') {
                            if (Number(generalStockVal) < 100) {
                                isGeneralStockOk = false;
                            }
                        }

                        let isGerenciaStockOk = true;
                        let gerenciaStockVal = undefined;
                        let hasGerenciaSelected = false;

                        if (state.gerenciaId && db.cuotas) {
                            hasGerenciaSelected = true;
                            const currentGid = String(state.gerenciaId).trim().toLowerCase();
                            const gerenciaObj = db.gerencias.find(g => String(g.id).trim().toLowerCase() === currentGid || String(g.name).trim().toLowerCase() === currentGid);
                            let gerenciaStockMap = undefined;
                            
                            if (gerenciaObj) {
                                const idKey = String(gerenciaObj.id).trim().toLowerCase();
                                const nameKey = String(gerenciaObj.name).trim().toLowerCase();
                                const exactKey = Object.keys(db.cuotas).find(k => {
                                    const cleanKey = String(k).trim().toLowerCase();
                                    return cleanKey === idKey || cleanKey === nameKey;
                                });
                                if (exactKey) gerenciaStockMap = db.cuotas[exactKey];
                            }

                            if (gerenciaStockMap) {
                                const targetKey = Object.keys(gerenciaStockMap).find(k => String(k).replace(/\D/g, '') === searchDigits);
                                if (targetKey !== undefined) gerenciaStockVal = gerenciaStockMap[targetKey];

                                if (gerenciaStockVal !== undefined && gerenciaStockVal !== null && String(gerenciaStockVal).trim() !== '') {
                                    if (Number(gerenciaStockVal) < 100) {
                                        isGerenciaStockOk = false;
                                    }
                                }
                            }
                        }

                        let quotaText = "Consultar gerencia";
                        let quotaClass = "text-text-mut";

                        if (!isGeneralStockOk) {
                            quotaText = "Indisponible";
                            quotaClass = "text-[#B91C1C] font-extrabold";
                        } else if (hasGerenciaSelected && !isGerenciaStockOk) {
                            quotaText = "Indisponible";
                            quotaClass = "text-[#B91C1C] font-extrabold";
                        } else if (hasGerenciaSelected && gerenciaStockVal !== undefined && Number(gerenciaStockVal) >= 100) {
                            quotaText = `Disponible: ${Number(gerenciaStockVal)} un.`;
                            quotaClass = state.tab.trim().toLowerCase() === 'natura' ? 'text-brand-orange font-bold' : 'text-avon-primary font-bold';
                        } else if (hasGerenciaSelected) {
                            quotaText = "Disponible";
                            quotaClass = "text-green-600 font-bold";
                        } else if (generalStockVal !== undefined && Number(generalStockVal) >= 100) {
                            quotaText = "Disponible";
                            quotaClass = "text-green-600 font-bold";
                        }

                        const actionIcon = 'share-2';
                        const safeDesc = plan.desc.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                        const brandString = item.marca || item.Marca || 'natura';
                        
                        const planLabel = totalPlans > 1 ? `Plan ${plan.type} (${planIdx + 1}/${totalPlans})` : (isMain ? 'Plan Original' : `Plan ${plan.type}`);
                        const uniqueKey = `${brandString}_${state.ciclo}_${plan.cod}_${plan.type}`;
                        const imgUrl = getImg(brandString, plan.cod);
                        const fileName = `${brandString}_${state.ciclo}_Cod${plan.cod}_Plan${plan.type}.jpg`;
                        const isChecked = selectedPlansMap.has(uniqueKey) ? 'checked' : '';

                        slide.innerHTML = `
                            <div class="relative mb-4">
                                <span class="absolute top-2 left-2 z-10 ${badgeColor} text-white text-[9px] font-bold px-3 py-1.5 rounded-lg uppercase tracking-widest shadow-sm">
                                    ${planLabel}
                                </span>

                                ${selectionMode ? `
                                    <label class="absolute top-2 right-2 z-30 bg-white/90 backdrop-blur-md p-1.5 rounded-xl shadow-md border border-gray-200 flex items-center justify-center cursor-pointer hover:bg-white active:scale-95 transition-all">
                                        <input type="checkbox" ${isChecked} onchange="togglePlanSelection('${uniqueKey}', '${imgUrl}', '${fileName}', this)" class="w-5 h-5 text-brand-orange rounded-md border-gray-300 focus:ring-brand-orange cursor-pointer">
                                    </label>
                                ` : `
                                    <button type="button" onclick="shareImage(this, ${itemIdx})" data-cod="${plan.cod}" data-desc="${safeDesc}" title="Opciones de Placa" class="absolute top-2 right-2 z-20 w-8 h-8 flex items-center justify-center bg-white/80 backdrop-blur-sm rounded-full text-text-main shadow-sm hover:bg-white cursor-pointer">
                                         <i data-lucide="${actionIcon}" class="w-4 h-4"></i>
                                    </button>
                                `}

                                <div class="aspect-square bg-brand-gray rounded-xl flex items-center justify-center p-6 border border-gray-50">
                                    <img src="${imgUrl}" onerror="handleImageError(this, '${brandString.replace(/'/g, "\\'")}', '${plan.cod}')" class="max-w-full max-h-full object-contain mix-blend-multiply">
                                </div>

                                ${totalPlans > 1 ? `
                                    <button type="button" onclick="scrollCarousel(this, -1)" class="absolute left-2 top-1/2 -translate-y-1/2 z-20 w-8 h-8 flex items-center justify-center bg-white/90 backdrop-blur-md shadow-md rounded-full border border-gray-200 text-gray-800 hover:bg-white active:scale-95 transition-all cursor-pointer">
                                        <i data-lucide="chevron-left" class="w-5 h-5 stroke-[2.5]"></i>
                                    </button>
                                    <button type="button" onclick="scrollCarousel(this, 1)" class="absolute right-2 top-1/2 -translate-y-1/2 z-20 w-8 h-8 flex items-center justify-center ${badgeColor} text-white shadow-md rounded-full hover:opacity-90 active:scale-95 transition-all cursor-pointer animate-pulse">
                                        <i data-lucide="chevron-right" class="w-5 h-5 stroke-[3]"></i>
                                    </button>
                                ` : ''}
                            </div>
                            <div class="flex-1 flex flex-col">
                                <span class="text-[10px] text-text-mut font-bold tracking-widest uppercase mb-1">Cód: ${plan.cod}</span>
                                <h4 class="text-sm font-bold text-text-main leading-tight mb-4 flex-1 line-clamp-2">${plan.desc}</h4>
                                <div class="pt-4 border-t border-gray-50 flex items-center justify-between">
                                    <span class="text-[11px] uppercase tracking-wider ${quotaClass}">${quotaText}</span>
                                </div>
                            </div>
                        `;
                        carousel.appendChild(slide);
                    });
                    
                    card.appendChild(carousel);
                    grid.appendChild(card);
                });
            }
            if (window.lucide) lucide.createIcons();
            const yearEl = document.getElementById('year');
            if (yearEl) yearEl.textContent = new Date().getFullYear();
        }

        function updateLastUpdate(isoDate) {
            const d = isoDate ? new Date(isoDate) : new Date();
            const lastUpdateEl = document.getElementById('last-update');
            if (lastUpdateEl) {
                lastUpdateEl.textContent = `${d.getDate()}/${d.getMonth() + 1}/${d.getFullYear()} ${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')}`;
            }
        }

        window.onload = init;
    </script>
</body>
</html>
